<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型快訊監測台</title>
<style>
  :root{
    --ink:#0F141C; --paper:#E7EAEF; --panel:#FFF; --line:#CFD6E0;
    --mute:#6A7484; --signal:#2D3BFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,
                "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
  .bar-in,.strip-in,.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}

  header.bar{background:var(--ink);color:#fff;}
  .bar-in{display:flex;align-items:flex-end;justify-content:space-between;
          gap:16px;padding-top:22px;padding-bottom:20px;flex-wrap:wrap;}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 0;line-height:1.1;}
  .eyebrow{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8D97A8;}
  .eyebrow.dark{color:var(--mute);margin-bottom:10px;}
  .clock{text-align:right;}
  .clock-l{display:block;font-size:10px;letter-spacing:.14em;color:#8D97A8;text-transform:uppercase;}
  .clock-v{font-family:ui-monospace,SFMono-Regular,"Roboto Mono",monospace;
           font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.04em;}

  .strip{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
  .strip-in{display:flex;align-items:center;justify-content:space-between;
            gap:12px;padding:10px 20px;flex-wrap:wrap;}
  .meta{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;
        color:var(--mute);font-variant-numeric:tabular-nums;}
  .strip-r{display:flex;gap:8px;align-items:center;}
  select{font-size:12px;padding:7px 8px;border:1px solid var(--line);
         background:#fff;border-radius:2px;color:var(--ink);}
  .btn{background:var(--signal);color:#fff;border:0;border-radius:2px;padding:9px 18px;
       font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.02em;}
  .btn:hover:not(:disabled){background:#1F2BD8;}
  .btn:disabled{background:#9AA3B5;cursor:progress;}
  .btn.ghost{background:none;color:var(--mute);border:1px solid var(--line);}
  .btn.ghost:hover{color:var(--signal);border-color:var(--signal);background:none;}

  .wrap{padding-top:18px;}
  .msg{border-left:3px solid var(--signal);background:#fff;padding:12px 14px;
       font-size:13px;line-height:1.7;margin-bottom:16px;}
  .msg.bad{border-left-color:#B23A2E;}

  .grid{display:grid;grid-template-columns:236px 1fr;gap:28px;padding-bottom:56px;}
  .rail{position:sticky;top:60px;align-self:start;}
  .tally{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
         border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer;
         text-align:left;color:var(--ink);font:inherit;}
  .tally:disabled{opacity:.35;cursor:default;}
  .tally.on{color:var(--signal);}
  .t-name{flex:1;font-size:12.5px;font-weight:500;}
  .t-bar{display:flex;gap:1.5px;}
  .t-bar i{width:2px;height:11px;background:var(--line);display:block;}
  .t-bar i.lit{background:currentColor;}
  .t-n{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;
       width:20px;text-align:right;font-variant-numeric:tabular-nums;}
  .note{font-size:11.5px;line-height:1.7;color:var(--mute);margin-top:14px;}

  .feed{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:16px 18px;}
  .card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:600;border:1px solid;border-radius:2px;
       padding:2px 7px;letter-spacing:.04em;}
  .src{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px;color:var(--mute);}
  .card h2{font-size:17px;font-weight:600;line-height:1.5;margin:0;letter-spacing:-.01em;}
  .card h2 a{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);
             background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;
             transition:background-size .2s;}
  .card h2 a:hover{background-size:100% 1px;}
  .sum{font-size:13.5px;line-height:1.75;color:#3A4453;margin:8px 0 0;}
  .card-btm{display:flex;align-items:center;justify-content:space-between;
            gap:10px;margin-top:12px;flex-wrap:wrap;}
  .models{display:flex;gap:5px;flex-wrap:wrap;}
  .m{font-size:11px;background:#EEF1F6;color:#4A5464;padding:2px 7px;border-radius:2px;}
  .go{font-size:12px;font-weight:600;color:var(--signal);text-decoration:none;white-space:nowrap;}
  .go:hover{text-decoration:underline;}
  .empty{background:var(--panel);border:1px dashed var(--line);padding:40px 20px;text-align:center;}
  .empty p{margin:0;font-size:15px;font-weight:600;}
  .empty .sub{margin-top:6px;font-size:13px;font-weight:400;color:var(--mute);}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr;gap:20px;}
    .rail{position:static;}
    h1{font-size:24px;}
    .clock-v{font-size:18px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div>
      <div class="eyebrow">每日 06:00 · AI 語言模型</div>
      <h1>模型快訊監測台</h1>
    </div>
    <div class="clock">
      <span class="clock-l">距下次自動更新</span>
      <span class="clock-v" id="clock">--:--:--</span>
    </div>
  </div>
</header>

<div class="strip">
  <div class="strip-in">
    <span class="meta" id="status">載入中…</span>
    <div class="strip-r">
      <select id="editions" hidden></select>
      <button class="btn ghost" id="rescrape" hidden>重新爬取</button>
      <button class="btn" id="reload">立即更新</button>
    </div>
  </div>
</div>

<div class="wrap"><div id="msg"></div></div>

<main class="wrap grid">
  <aside class="rail">
    <div class="eyebrow dark">聲量刻度</div>
    <div id="rail"></div>
    <p class="note">
      資料由 GitHub Actions 每日台北時間 06:00 自動擷取並提交。
      「立即更新」重新讀取最新一期;「重新爬取」會即時觸發一次伺服器端擷取。
    </p>
  </aside>
  <section class="feed" id="feed"></section>
</main>

<script>
const CAMPS = [
  ["openai",    "OpenAI · GPT"],
  ["anthropic", "Anthropic · Claude"],
  ["google",    "Google · Gemini"],
  ["meta",      "Meta · Llama"],
  ["cn",        "中國模型"],
  ["other",     "其他業者"],
];
const TAGS = {
  "產品發表":"#2D3BFF", "研究":"#0F6E5C", "商業":"#8A5A00",
  "政策":"#6B3FA0", "安全":"#B23A2E",
};

// 選填：填入你的 repo（例如 "yourname/ai-news"）即可啟用「重新爬取」按鈕。
// 需搭配一組有 actions:write 權限的 token，僅建議在私有部署使用。
const REPO = "";
const WORKFLOW = "daily-ai-news.yml";

let data = { items: [] }, filter = "all";
const $ = (id) => document.getElementById(id);

/* ---- 倒數到下一個 06:00 ---- */
function tick() {
  const now = new Date();
  const t = new Date(now);
  t.setHours(6, 0, 0, 0);
  if (now >= t) t.setDate(t.getDate() + 1);
  let s = Math.max(0, Math.floor((t - now) / 1000));
  const p = (n) => String(n).padStart(2, "0");
  $("clock").textContent =
    `${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`;
}
setInterval(tick, 1000); tick();

function say(text, bad) {
  $("msg").innerHTML = text ? `<div class="msg${bad ? " bad" : ""}">${text}</div>` : "";
}

/* ---- 載入資料 ---- */
async function load(path = "data/news.json") {
  $("reload").disabled = true;
  $("reload").textContent = "讀取中…";
  try {
    const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    say("");
    render();
  } catch (err) {
    say(`讀不到 ${path}。若是第一次部署，先到 Actions 頁面手動跑一次「每日 AI 新聞擷取」產生資料。（${err.message}）`, true);
  } finally {
    $("reload").disabled = false;
    $("reload").textContent = "立即更新";
  }
}

async function loadEditions() {
  try {
    const res = await fetch(`data/index.json?t=${Date.now()}`, { cache: "no-store" });
    const list = (await res.json()).editions || [];
    if (list.length < 2) return;
    const sel = $("editions");
    sel.innerHTML = list.map((d) => `<option value="${d}">${d} 期</option>`).join("");
    sel.hidden = false;
    sel.onchange = () => { filter = "all"; load(`data/archive/${sel.value}.json`); };
  } catch { /* 還沒有存檔就不顯示 */ }
}

/* ---- 觸發伺服器端重新爬取 ---- */
if (REPO) {
  $("rescrape").hidden = false;
  $("rescrape").onclick = async () => {
    let token = sessionStorage.getItem("gh_token");
    if (!token) {
      token = prompt("貼上具 actions:write 權限的 GitHub token（只存在本次瀏覽階段）：");
      if (!token) return;
      sessionStorage.setItem("gh_token", token);
    }
    $("rescrape").disabled = true;
    try {
      const res = await fetch(
        `https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
        {
          method: "POST",
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
          },
          body: JSON.stringify({ ref: "main" }),
        }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      say("已送出爬取要求。約 1–2 分鐘後按「立即更新」取回新資料。");
    } catch (err) {
      sessionStorage.removeItem("gh_token");
      say(`觸發失敗:${err.message}。確認 token 權限與 repo 名稱後再試。`, true);
    } finally {
      $("rescrape").disabled = false;
    }
  };
}

/* ---- 畫面 ---- */
function render() {
  const items = data.items || [];
  const stamp = data.fetchedAt ? data.fetchedAt.slice(0, 16).replace("T", " ") : "—";
  $("status").textContent = `${data.edition || "—"} 期 · 最後擷取 ${stamp} · ${items.length} 則`;

  const counts = CAMPS.map(([id, label]) => ({
    id, label, n: items.filter((i) => (i.camps || []).includes(id)).length,
  }));
  const peak = Math.max(1, ...counts.map((c) => c.n));

  $("rail").innerHTML =
    `<button class="tally ${filter === "all" ? "on" : ""}" data-c="all">
       <span class="t-name">全部</span><span class="t-n">${items.length}</span>
     </button>` +
    counts.map((c) => `
      <button class="tally ${filter === c.id ? "on" : ""}" data-c="${c.id}" ${c.n ? "" : "disabled"}>
        <span class="t-name">${c.label}</span>
        <span class="t-bar" aria-hidden="true">${
          Array.from({ length: 12 }, (_, i) =>
            `<i class="${i < Math.round(c.n / peak * 12) ? "lit" : ""}"></i>`).join("")
        }</span>
        <span class="t-n">${c.n}</span>
      </button>`).join("");

  $("rail").querySelectorAll(".tally").forEach((b) => {
    b.onclick = () => {
      const c = b.dataset.c;
      filter = (c === filter || c === "all") ? "all" : c;
      render();
    };
  });

  const shown = filter === "all"
    ? items
    : items.filter((i) => (i.camps || []).includes(filter));

  $("feed").innerHTML = shown.length ? shown.map((i) => {
    const color = TAGS[i.tag] || "#6A7484";
    return `<article class="card">
      <div class="card-top">
        <span class="tag" style="color:${color};border-color:${color}">${i.tag || ""}</span>
        <span class="src">${esc(i.source)} · ${esc(i.date)}</span>
      </div>
      <h2><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a></h2>
      ${i.summary ? `<p class="sum">${esc(i.summary)}</p>` : ""}
      <div class="card-btm">
        <div class="models">${(i.models || []).map((m) => `<span class="m">${esc(m)}</span>`).join("")}</div>
        <a class="go" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">開啟原文 ↗</a>
      </div>
    </article>`;
  }).join("") : `<div class="empty">
      <p>這個篩選條件下沒有新聞。</p>
      <p class="sub">點左側「全部」看完整清單。</p>
    </div>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

$("reload").onclick = () => load();
loadEditions();
load();
</script>
</body>
</html>
