<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型快訊監測台</title>
<style>
  :root{
    --ink:#0F141C; --paper:#E7EAEF; --panel:#FFF; --line:#CFD6E0;
    --mute:#6A7484; --signal:#2D3BFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,
                "PingFang TC","Noto Sans TC","Hiragino Sans","Yu Gothic",
                "Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
  .bar-in,.strip-in,.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}

  header.bar{background:var(--ink);color:#fff;}
  .bar-in{display:flex;align-items:flex-end;justify-content:space-between;
          gap:16px;padding-top:22px;padding-bottom:20px;flex-wrap:wrap;}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 0;line-height:1.15;}
  .eyebrow{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8D97A8;}
  .bar-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .clock-l{display:block;font-size:10px;letter-spacing:.14em;color:#8D97A8;text-transform:uppercase;}
  .clock-v{font-family:ui-monospace,SFMono-Regular,"Roboto Mono",monospace;
           font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.04em;}
  #uiLang{background:#1C2432;color:#fff;border:1px solid #33405480;}

  .strip{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
  .strip-in{display:flex;align-items:center;justify-content:space-between;
            gap:12px;padding:10px 20px;flex-wrap:wrap;}
  .meta{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;
        color:var(--mute);font-variant-numeric:tabular-nums;}
  .strip-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sortwrap{display:flex;align-items:center;gap:6px;}
  .sortwrap label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
                  color:var(--mute);font-weight:600;}
  select{font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);
         background:#fff;border-radius:2px;color:var(--ink);}
  .btn{background:var(--signal);color:#fff;border:0;border-radius:2px;padding:9px 18px;
       font:inherit;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.02em;}
  .btn:hover:not(:disabled){background:#1F2BD8;}
  .btn:disabled{opacity:.5;cursor:progress;}
  .btn.ghost{background:none;color:var(--mute);border:1px solid var(--line);}
  .btn.ghost:hover:not(:disabled){color:var(--signal);border-color:var(--signal);background:none;}

  .wrap{padding-top:18px;}
  .msg{border-left:3px solid var(--signal);background:#fff;padding:12px 14px;
       font-size:13px;line-height:1.7;margin-bottom:16px;}
  .msg.bad{border-left-color:#B23A2E;}

  .grid{display:grid;grid-template-columns:250px 1fr;gap:28px;padding-bottom:56px;}
  .rail{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 80px);overflow-y:auto;}

  .fhead{display:flex;align-items:baseline;justify-content:space-between;
         gap:8px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:2px;}
  .clearall{background:none;border:0;padding:0;font:inherit;font-size:11.5px;
            color:var(--signal);cursor:pointer;text-decoration:underline;}
  .clearall[hidden]{display:none;}

  details.fg{border-bottom:1px solid var(--line);}
  details.fg > summary{
    list-style:none;cursor:pointer;padding:11px 2px;display:flex;
    align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;color:var(--mute);}
  details.fg > summary::-webkit-details-marker{display:none;}
  details.fg > summary::after{content:"+";margin-left:auto;font-size:14px;
    font-weight:400;letter-spacing:0;}
  details.fg[open] > summary::after{content:"–";}
  details.fg > summary .picked{
    font-family:ui-monospace,SFMono-Regular,monospace;letter-spacing:0;
    color:var(--signal);text-transform:none;font-size:11px;}
  .opts{padding:0 0 10px;display:flex;flex-direction:column;gap:1px;}
  .opts.scroll{max-height:210px;overflow-y:auto;}

  .opt{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;
       padding:6px 2px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;}
  .opt:disabled{opacity:.32;cursor:default;}
  .box{width:13px;height:13px;border:1.5px solid var(--line);flex:none;
       display:flex;align-items:center;justify-content:center;font-size:10px;
       line-height:1;color:#fff;}
  .opt[aria-pressed=true] .box{background:var(--signal);border-color:var(--signal);}
  .opt[aria-pressed=true] .o-name{color:var(--signal);font-weight:600;}
  .o-name{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .o-n{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px;
       color:var(--mute);font-variant-numeric:tabular-nums;}
  .note{font-size:11.5px;line-height:1.7;color:var(--mute);margin:14px 0 0;}

  .feed{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:16px 18px;}
  .card-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:600;border:1px solid;border-radius:2px;
       padding:2px 7px;letter-spacing:.04em;}
  .src{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px;color:var(--mute);}
  .lang{font-size:10.5px;color:var(--mute);border:1px solid var(--line);
        border-radius:2px;padding:2px 6px;}
  .card-body{display:flex;gap:14px;align-items:flex-start;}
  .card-main{flex:1;min-width:0;}
  .thumb{flex:none;width:104px;height:78px;border-radius:2px;overflow:hidden;
         background:#DFE4EB;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .stats{display:flex;gap:12px;flex-wrap:wrap;align-items:center;
         font-family:ui-monospace,SFMono-Regular,monospace;
         font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;}
  .stats b{font-weight:600;color:#3A4453;}
  .heat{display:inline-flex;align-items:center;gap:5px;margin-left:auto;}
  .heat-bar{display:flex;gap:2px;}
  .heat-bar i{width:3px;height:12px;background:var(--line);display:block;}
  .heat-bar i.lit{background:#D1493F;}
  .heat-n{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;
          color:var(--mute);font-variant-numeric:tabular-nums;}
  .card h2{font-size:17px;font-weight:600;line-height:1.5;margin:0;letter-spacing:-.01em;}
  .card h2 a{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);
             background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;
             transition:background-size .2s;}
  .card h2 a:hover{background-size:100% 1px;}
  .sum{font-size:13.5px;line-height:1.75;color:#3A4453;margin:8px 0 0;}
  .orig{font-size:12px;line-height:1.6;color:var(--mute);margin:8px 0 0;}
  .orig summary{cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
  .card-btm{display:flex;align-items:center;justify-content:space-between;
            gap:10px;margin-top:12px;flex-wrap:wrap;}
  .models{display:flex;gap:5px;flex-wrap:wrap;}
  .m{font-size:11px;background:#EEF1F6;color:#4A5464;padding:2px 7px;border-radius:2px;}
  .go{font-size:12px;font-weight:600;color:var(--signal);text-decoration:none;white-space:nowrap;}
  .go:hover{text-decoration:underline;}
  .empty{background:var(--panel);border:1px dashed var(--line);padding:40px 20px;text-align:center;}
  .empty p{margin:0;font-size:15px;font-weight:600;}
  .empty .sub{margin-top:6px;font-size:13px;font-weight:400;color:var(--mute);}

  nav.tabs{background:var(--ink);border-top:1px solid rgba(255,255,255,.10);}
  .tabs-in{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;overflow-x:auto;}
  .tab{background:none;border:0;border-bottom:2px solid transparent;color:#8D97A8;
       font:inherit;font-size:13px;font-weight:600;padding:12px 16px;cursor:pointer;
       letter-spacing:.02em;white-space:nowrap;}
  .tab:hover{color:#fff;}
  .tab[aria-selected=true]{color:#fff;border-bottom-color:#6C7CFF;}

  .ftoggle{display:none;}
  @media (max-width:760px){
    .thumb{width:76px;height:58px;}
    .grid{grid-template-columns:1fr;gap:16px;}
    .rail{position:static;max-height:none;overflow:visible;}
    .ftoggle{display:block;width:100%;margin-bottom:10px;}
    .rail.collapsed .fpanel{display:none;}
    h1{font-size:24px;}
    .clock-v{font-size:18px;}
    .bar-r{align-items:flex-start;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div>
      <div class="eyebrow" id="tEyebrow"></div>
      <h1 id="tTitle"></h1>
    </div>
    <div class="bar-r">
      <select id="uiLang" aria-label="Display language"></select>
      <div style="text-align:right">
        <span class="clock-l" id="tNext"></span>
        <span class="clock-v" id="clock">--:--:--</span>
      </div>
    </div>
  </div>
</header>

<nav class="tabs"><div class="tabs-in" id="tabs" role="tablist"></div></nav>

<div class="strip">
  <div class="strip-in">
    <span class="meta" id="status"></span>
    <div class="strip-r">
      <div class="sortwrap">
        <label for="sort" id="tSort"></label>
        <select id="sort"></select>
      </div>
      <button class="btn" id="reload"></button>
    </div>
  </div>
</div>

<div class="wrap"><div id="msg"></div></div>

<main class="wrap grid">
  <aside class="rail collapsed" id="rail">
    <button class="btn ghost ftoggle" id="ftoggle"></button>
    <div class="fpanel">
      <div class="fhead">
        <span class="eyebrow" style="color:var(--ink)" id="tFilter"></span>
        <button class="clearall" id="clearAll" hidden></button>
      </div>
      <div id="groups"></div>
      <p class="note" id="tNote"></p>
    </div>
  </aside>
  <section class="feed" id="feed"></section>
</main>

function loadPref() {
  try { const v = localStorage.getItem("uiLang"); if (v && UI[v]) return v; } catch {}

  if (/^zh\b.*(cn|hans|sg)/.test(nav)) return "zh-CN";

  }

}

function field(it, key) {
  const t = it.i18n && it.i18n[cur];
  if (t && t[key]) return t[key];
  const m = mtCache.get(`${it.url}|${cur}`);
  if (m && m[key]) return m[key];
  return it[key] || "";
}
const isTranslated = (it) =>
  !!((it.i18n && it.i18n[cur] && it.i18n[cur].title)
     || (mtCache.get(`${it.url}|${cur}`) || {}).title);

/* --- 備援：瀏覽器內建翻譯（Chrome 138+）。沒有 API 金鑰時仍能看到譯文。 --- */
// 兩個後端吃的語言代碼不一樣，分開對照
const MT_LANG = { "zh-TW": "zh-Hant", "zh-CN": "zh-Hans" };   // Chrome 內建翻譯
const MM_LANG = { "zh-TW": "zh-TW", "zh-CN": "zh-CN" };       // MyMemory
const mtCache = new Map();    // `${url}|${lang}` → { title, summary }
const mtPool = new Map();
let mtOff = false;

async function mtGet(src, tgt) {
  const key = `${src}|${tgt}`;
  if (mtPool.has(key)) return mtPool.get(key);
  const a = await Translator.availability({ sourceLanguage: src, targetLanguage: tgt });
  const tr = a === "unavailable"
    ? null
    : await Translator.create({ sourceLanguage: src, targetLanguage: tgt });
  mtPool.set(key, tr);
  return tr;
}

/* 第二層備援：MyMemory 免費翻譯 API，不需要金鑰。
   匿名額度約每日 5 千字；填入 email 可提高到 5 萬字。
   品質與額度都不如爬蟲端預先翻譯，只是沒有金鑰時的替代方案。 */
const MM_EMAIL = "";          // 想提高額度就填自己的 email
let mmOff = false;

async function mmTranslate(text, src, tgt) {
  const u = new URL("https://api.mymemory.translated.net/get");
  u.searchParams.set("q", text.slice(0, 480));
  u.searchParams.set("langpair", `${src}|${tgt}`);
  if (MM_EMAIL) u.searchParams.set("de", MM_EMAIL);
  const r = await fetch(u);
  const j = await r.json();
  const out = j && j.responseData && j.responseData.translatedText;
  if (!out || Number(j.responseStatus) !== 200) throw new Error("quota");
  return out;
}

/* 譯文寫進 localStorage，換頁或重新載入不必重譯，省額度。 */
function mtLoad() {
  try {
    const raw = localStorage.getItem("mtCache");
    if (raw) for (const [k, v] of Object.entries(JSON.parse(raw))) mtCache.set(k, v);
  } catch {}
}
function mtSave() {
  try {
    const obj = {};
    let n = 0;
    for (const [k, v] of mtCache) { if (n++ > 600) break; obj[k] = v; }
    localStorage.setItem("mtCache", JSON.stringify(obj));
  } catch {}
}

async function machineTranslate(list) {
  const tgt = MT_LANG[cur] || cur;
  const todo = list.filter((i) => !isTranslated(i)
                                  && langOf(i) !== cur.split("-")[0]).slice(0, 15);
  if (!todo.length) return;

  const builtin = !mtOff && typeof Translator !== "undefined";
  if (!builtin && mmOff) return;

  let n = 0;
  for (const it of todo) {
    const src = langOf(it);
    try {
      let title, summary;
      if (builtin) {
        const tr = await mtGet(src, tgt);
        if (!tr) continue;
        title = await tr.translate(it.title);
        summary = it.summary ? await tr.translate(it.summary) : "";
      } else {
        const mtgt = MM_LANG[cur] || cur;
        title = await mmTranslate(it.title, src, mtgt);
        summary = it.summary ? await mmTranslate(it.summary, src, mtgt) : "";
      }
      mtCache.set(`${it.url}|${cur}`, { title, summary });
      n++;
    } catch {
      if (builtin) { mtOff = true; } else { mmOff = true; }
      break;        // 額度用盡或不支援就停手，已翻好的仍會顯示
    }
  }
  if (n) { mtSave(); renderFeed(); }
}

function langOf(it) {
  if (it.lang) return it.lang;
  const t = String(it.title || "");
  if (/[\u3040-\u30ff]/.test(t)) return "ja";
  if (/[\uac00-\ud7af]/.test(t)) return "ko";
  const cjk = (t.match(/[\u4e00-\u9fff]/g) || []).length;
  return cjk / (t.replace(/\s/g, "").length || 1) > 0.15 ? "zh" : "en";
}

const timeOf = (it) => {
  const ms = Date.parse(String(it.publishedAt || it.date || "").replace(" ", "T"));
  return Number.isNaN(ms) ? 0 : ms;
};

/* ================================================================== */
/*  倒數                                                              */
/* ================================================================== */

function tick() {
  const now = new Date(), t = new Date();
  t.setHours(6, 0, 0, 0);
  if (now >= t) t.setDate(t.getDate() + 1);
  const s = Math.max(0, Math.floor((t - now) / 1000));
  const p = (n) => String(n).padStart(2, "0");
  $("clock").textContent = `${p(s / 3600 | 0)}:${p(s % 3600 / 60 | 0)}:${p(s % 60)}`;
}
setInterval(tick, 1000); tick();

/* ================================================================== */
/*  資料                                                              */
/* ================================================================== */

async function grab(path) {
  const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadEdition(edition) {
  if (loaded.has(edition)) return;
  const p = await grab(`${CH().base}/archive/${edition}.json`);
  loaded.set(edition, (p.items || []).map((it) => ({ ...it, edition })));
  merge();
}

function merge() {
  const seen = new Set(); items = [];
  for (const list of loaded.values()) {
    for (const it of list) {
      const key = String(it.url || "").split("?")[0];
      if (key && !seen.has(key)) { seen.add(key); items.push(it); }
    }
  }
}

async function boot() {
  booted = true;
  const base = CH().base;
  try {
    const latest = await grab(`${base}/news.json`);
    const c = latest.edition;
    loaded.set(c, (latest.items || []).map((it) => ({ ...it, edition: c })));
    F.date.add(c);
    try { editions = ((await grab(`${base}/index.json`)).editions || []).slice(0, 30); }
    catch { editions = []; }
    if (!editions.includes(c)) editions.unshift(c);
    merge(); say(""); renderAll();
  } catch (err) {
    items = []; renderAll();
    say(esc(T().errLoad(err.message)), "bad");
  }
}

async function switchTab(next) {
  if (next === ch || !CHANNELS[next]) return;
  saveState();
  ch = next;
  restoreState();
  renderAll();
  if (!booted) await boot();
}

/* ================================================================== */
/*  篩選                                                              */
/* ================================================================== */

const TESTS = {
  date:   (it, s) => s.has(it.edition),
  line:   (it, s) => (it.lines || ["other"]).some((l) => s.has(l)),
  camp:   (it, s) => (it.camps || ["other"]).some((c) => s.has(c)),
  lang:   (it, s) => s.has(langOf(it)),
  tag:    (it, s) => s.has(it.tag),
  source: (it, s) => s.has(it.source),
};

function pass(it, skip) {
  const force = CH().forceLine;
  if (force && !(it.lines || []).includes(force)) return false;
  for (const k of Object.keys(F)) {
    if (k === skip) continue;
    if (F[k].size && !TESTS[k](it, F[k])) return false;
  }
  return true;
}
const countFor = (g, v) =>
  items.filter((it) => pass(it, g) && TESTS[g](it, new Set([v]))).length;

function results() {
  const cmp = {
    heat:   (a, b) => (b.heat || 0) - (a.heat || 0) || timeOf(b) - timeOf(a),
    new:    (a, b) => timeOf(b) - timeOf(a),
    old:    (a, b) => timeOf(a) - timeOf(b),
    source: (a, b) => String(a.source).localeCompare(String(b.source), cur) || timeOf(b) - timeOf(a),
    tag:    (a, b) => String(T().tags[a.tag] || a.tag)
                        .localeCompare(String(T().tags[b.tag] || b.tag), cur) || timeOf(b) - timeOf(a),
    title:  (a, b) => field(a, "title").localeCompare(field(b, "title"), cur),
  }[sortBy];
  return items.filter((it) => pass(it, null)).sort(cmp);
}
const activeCount = () => Object.values(F).reduce((n, s) => n + s.size, 0);

/* ================================================================== */
/*  介面                                                              */
/* ================================================================== */

function renderChrome() {
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  $("tEyebrow").textContent = t.eyebrow;
  $("tTitle").textContent = t.title;
  $("tNext").textContent = t.next;
  $("tSort").textContent = t.sort;
  $("tFilter").textContent = t.filter;
  $("tNote").textContent = t.note;
  $("clearAll").textContent = t.clearAll;
  $("reload").textContent = t.reload;
  $("ftoggle").textContent = $("rail").classList.contains("collapsed")
    ? t.filterBtn : t.filterHide;

  $("tabs").innerHTML = Object.keys(CHANNELS).map((k) =>
    `<button class="tab" role="tab" data-ch="${k}"
       aria-selected="${k === ch}">${esc(TAB_FIXED[k] || t.tabs[k])}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => {
    b.onclick = () => switchTab(b.dataset.ch);
  });

  $("uiLang").innerHTML = Object.entries(UI)
    .map(([code, u]) => `<option value="${code}" ${code === cur ? "selected" : ""}>${u.name}</option>`)
    .join("");
  $("sort").innerHTML = Object.entries(t.sorts)
    .map(([k, label]) => `<option value="${k}" ${k === sortBy ? "selected" : ""}>${esc(label)}</option>`)
    .join("");
}

function groupDefs() {
  const t = T();
  const sources = [...new Set(items.map((i) => i.source).filter(Boolean))]
    .sort((a, b) => String(a).localeCompare(String(b), cur));
  const groups = [
    { key: "date",   open: true,  opts: editions.map((d) => [d, d]) },
    { key: "camp",   open: true,
      opts: CH().ids.map((c) => [c, BRAND_FIXED[c] || t.camps[c] || c]) },
    { key: "lang",   open: true,  opts: ["zh", "en", "ja", "ko"].map((l) => [l, t.langs[l]]) },
    { key: "tag",    open: false, opts: CH().tagKeys.map((k) => [k, t.tags[k] || k]) },
    { key: "source", open: false, scroll: true, opts: sources.map((s) => [s, s]) },
  ];

  // 產品線只有 DGX / RTX Spark 分頁才有
  if (CH().lineIds) {
    groups.splice(1, 0, {
      key: "line", open: true,
      opts: CH().lineIds.map((l) => [l, LINE_FIXED[l] || t.camps.other]),
    });
  }
  return groups;
}

function renderGroups() {
  const t = T();
  const openNow = new Set(
    [...document.querySelectorAll("details.fg[open]")].map((d) => d.dataset.g));
  const first = !$("groups").children.length;

  $("groups").innerHTML = groupDefs().map((g) => {
    const picked = F[g.key].size;
    const open = first ? g.open : openNow.has(g.key);
    return `<details class="fg" data-g="${g.key}" ${open ? "open" : ""}>
      <summary>${esc(g.key === "camp" ? t.groups[CH().groupLabel] : t.groups[g.key])}${picked ? `<span class="picked">${esc(t.picked(picked))}</span>` : ""}</summary>
      <div class="opts${g.scroll ? " scroll" : ""}">
        ${g.opts.map(([val, name]) => {
          const on = F[g.key].has(val);
          const n = countFor(g.key, val);
          const dim = !on && n === 0 && g.key !== "date";
          return `<button class="opt" aria-pressed="${on}" ${dim ? "disabled" : ""}
                    data-g="${g.key}" data-v="${esc(val)}" title="${esc(name)}">
            <span class="box" aria-hidden="true">${on ? "✓" : ""}</span>
            <span class="o-name">${esc(name)}</span>
            <span class="o-n">${n}</span>
          </button>`;
        }).join("")}
      </div>
    </details>`;
  }).join("");

  $("groups").querySelectorAll(".opt").forEach((b) => {
    b.onclick = () => toggle(b.dataset.g, b.dataset.v);
  });
  $("clearAll").hidden = activeCount() === 0;
}

async function toggle(group, value) {
  const set = F[group], on = !set.has(value);
  on ? set.add(value) : set.delete(value);
  if (group === "date" && on && !loaded.has(value)) {
    say(esc(T().loading(value)));
    try { await loadEdition(value); say(""); }
    catch (err) { set.delete(value); say(esc(T().errArchive(value, err.message)), "bad"); }
  }
  renderAll();
}

const compact = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M"
  : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K" : String(n);

function statsRow(i) {
  const bits = [];
  if (i.views)    bits.push(`<span>▶ <b>${compact(i.views)}</b></span>`);
  if (i.score)    bits.push(`<span>▲ <b>${compact(i.score)}</b></span>`);
  if (i.comments) bits.push(`<span>💬 <b>${compact(i.comments)}</b></span>`);
  if (i.dupes)    bits.push(`<span>📰 <b>${i.dupes + 1}</b></span>`);
  return bits.length
    ? `<div class="stats" style="margin-top:10px">${bits.join("")}</div>` : "";
}

function heatBadge(i, t) {
  const h = i.heat || 0;
  const lit = Math.round(h / 20);
  const covered = (i.dupes || 0) + 1;
  const tip = [`${t.sorts.heat} ${h}/100`,
               covered > 1 ? `${covered}×` : null,
               (i.also || []).join(", ")].filter(Boolean).join(" · ");
  return `<span class="heat" title="${esc(tip)}">
    <span class="heat-bar" aria-hidden="true">${
      Array.from({ length: 5 }, (_, k) =>
        `<i class="${k < lit ? "lit" : ""}"></i>`).join("")}</span>
    <span class="heat-n">${h}${covered > 1 ? ` ·${covered}` : ""}</span>
  </span>`;
}

function renderFeed() {
  const t = T(), shown = results(), n = activeCount();
  $("status").textContent = t.status(shown.length, items.length, n, loaded.size);

  if (!shown.length) {
    $("feed").innerHTML = `<div class="empty">
      <p>${esc(t.emptyTitle)}</p>
      <p class="sub">${esc(n ? t.emptyHint : t.emptyNoData)}</p></div>`;
    return;
  }

  machineTranslate(shown);

  $("feed").innerHTML = shown.map((i) => {
    const color = TAG_COLORS[i.tag] || "#6A7484";
    const when = String(i.date || "").slice(0, 16).replace("T", " ");
    const srcLang = t.langs[langOf(i)] || langOf(i);
    const done = isTranslated(i);
    const title = field(i, "title"), summary = field(i, "summary");
    return `<article class="card">
      <div class="card-top">
        <span class="tag" style="color:${color};border-color:${color}">${esc(t.tags[i.tag] || i.tag || "")}</span>
        <span class="src">${esc(i.source)} · ${esc(when)}</span>
        <span class="lang">${esc(srcLang)}${done ? "" : " · " + esc(t.untranslated)}</span>
        ${heatBadge(i, t)}
      </div>
      <div class="card-body">
        <div class="card-main">
          <h2><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a></h2>
          ${summary ? `<p class="sum">${esc(summary)}</p>` : ""}
        </div>
        ${i.image ? `<div class="thumb"><img src="${esc(i.image)}" alt="" loading="lazy"
             referrerpolicy="no-referrer"
             onerror="this.parentNode.remove()"></div>` : ""}
      </div>
      ${done && i.title !== title ? `<details class="orig">
        <summary>${esc(t.showOriginal)}</summary>
        <div style="margin-top:6px">${esc(i.title)}${i.summary ? "<br>" + esc(i.summary) : ""}</div>
      </details>` : ""}
      ${statsRow(i)}
      <div class="card-btm">
        <div class="models">${(i.models || []).map((m) => `<span class="m">${esc(m)}</span>`).join("")}</div>
        <a class="go" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(t.open)}</a>
      </div>
    </article>`;
  }).join("");
}

function renderAll() { renderChrome(); renderGroups(); renderFeed(); }

/* ================================================================== */
/*  事件                                                              */
/* ================================================================== */

$("uiLang").onchange = () => { cur = $("uiLang").value; savePref(cur); renderAll(); };
$("sort").onchange = () => { sortBy = $("sort").value; renderFeed(); };
$("clearAll").onclick = () => { Object.values(F).forEach((s) => s.clear()); renderAll(); };
$("ftoggle").onclick = () => {
  $("rail").classList.toggle("collapsed");
  $("ftoggle").textContent = $("rail").classList.contains("collapsed")
    ? T().filterBtn : T().filterHide;
};
$("reload").onclick = async () => {
  const t = T();
  $("reload").disabled = true; $("reload").textContent = t.reloading;
  const keep = new Set(F.date);
  loaded.clear(); F.date.clear();
  try {
    const latest = await grab(`${CH().base}/news.json`);
    const c = latest.edition;
    loaded.set(c, (latest.items || []).map((it) => ({ ...it, edition: c })));
    for (const d of keep) {
      if (d === c) continue;
      try { await loadEdition(d); F.date.add(d); } catch {}
    }
    F.date.add(c);
    if (!editions.includes(c)) editions.unshift(c);
    merge(); say(""); renderAll();
  } catch (err) {
    say(esc(t.errRefresh(err.message)), "bad");
  } finally {
    $("reload").disabled = false; $("reload").textContent = T().reload;
  }
};

mtLoad();
cur = loadPref();
if (window.innerWidth > 760) $("rail").classList.remove("collapsed");
renderChrome();
boot();
</script>
</body>
</html>
