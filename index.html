<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型快訊監測台</title>
<style>
  :root{
    --ink:#0F141C; --paper:#E7EAEF; --panel:#FFF; --line:#CFD6E0;
    --mute:#6A7484; --signal:#2D3BFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,
                "PingFang TC","Noto Sans TC","Hiragino Sans","Yu Gothic",
                "Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
  .bar-in,.strip-in,.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}

  header.bar{background:var(--ink);color:#fff;}
  .bar-in{display:flex;align-items:flex-end;justify-content:space-between;
          gap:16px;padding-top:22px;padding-bottom:20px;flex-wrap:wrap;}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 0;line-height:1.15;}
  .eyebrow{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8D97A8;}
  .bar-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .clock-l{display:block;font-size:10px;letter-spacing:.14em;color:#8D97A8;text-transform:uppercase;}
  .clock-v{font-family:ui-monospace,SFMono-Regular,"Roboto Mono",monospace;
           font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.04em;}
  #uiLang{background:#1C2432;color:#fff;border:1px solid #33405480;}

  .strip{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
  .strip-in{display:flex;align-items:center;justify-content:space-between;
            gap:12px;padding:10px 20px;flex-wrap:wrap;}
  .meta{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;
        color:var(--mute);font-variant-numeric:tabular-nums;}
  .strip-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sortwrap{display:flex;align-items:center;gap:6px;}
  .sortwrap label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
                  color:var(--mute);font-weight:600;}
  select{font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);
         background:#fff;border-radius:2px;color:var(--ink);}
  .btn{background:var(--signal);color:#fff;border:0;border-radius:2px;padding:9px 18px;
       font:inherit;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.02em;}
  .btn:hover:not(:disabled){background:#1F2BD8;}
  .btn:disabled{opacity:.5;cursor:progress;}
  .btn.ghost{background:none;color:var(--mute);border:1px solid var(--line);}
  .btn.ghost:hover:not(:disabled){color:var(--signal);border-color:var(--signal);background:none;}

  .wrap{padding-top:18px;}
  .msg{border-left:3px solid var(--signal);background:#fff;padding:12px 14px;
       font-size:13px;line-height:1.7;margin-bottom:16px;}
  .msg.bad{border-left-color:#B23A2E;}

  .grid{display:grid;grid-template-columns:250px 1fr;gap:28px;padding-bottom:56px;}
  .rail{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 80px);overflow-y:auto;}

  .fhead{display:flex;align-items:baseline;justify-content:space-between;
         gap:8px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:2px;}
  .clearall{background:none;border:0;padding:0;font:inherit;font-size:11.5px;
            color:var(--signal);cursor:pointer;text-decoration:underline;}
  .clearall[hidden]{display:none;}

  details.fg{border-bottom:1px solid var(--line);}
  details.fg > summary{
    list-style:none;cursor:pointer;padding:11px 2px;display:flex;
    align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;color:var(--mute);}
  details.fg > summary::-webkit-details-marker{display:none;}
  details.fg > summary::after{content:"+";margin-left:auto;font-size:14px;
    font-weight:400;letter-spacing:0;}
  details.fg[open] > summary::after{content:"–";}
  details.fg > summary .picked{
    font-family:ui-monospace,SFMono-Regular,monospace;letter-spacing:0;
    color:var(--signal);text-transform:none;font-size:11px;}
  .opts{padding:0 0 10px;display:flex;flex-direction:column;gap:1px;}
  details.mo{margin:0 0 2px;}
  details.mo > summary{list-style:none;cursor:pointer;display:flex;align-items:center;
    gap:6px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--ink);}
  details.mo > summary::-webkit-details-marker{display:none;}
  details.mo > summary::before{content:"▸";font-size:9px;color:var(--mute);}
  details.mo[open] > summary::before{content:"▾";}
  details.mo > summary .mo-n{margin-left:auto;font-family:ui-monospace,SFMono-Regular,monospace;
    font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;}
  details.mo > summary .mo-sel{color:var(--signal);font-size:10.5px;}
  .mo-body{padding-left:12px;border-left:1px solid var(--line);margin-left:3px;}
  .opts.scroll{max-height:210px;overflow-y:auto;}

  .opt{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;
       padding:6px 2px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;}
  .opt:disabled{opacity:.32;cursor:default;}
  .box{width:13px;height:13px;border:1.5px solid var(--line);flex:none;
       display:flex;align-items:center;justify-content:center;font-size:10px;
       line-height:1;color:#fff;}
  .opt[aria-pressed=true] .box{background:var(--signal);border-color:var(--signal);}
  .opt[aria-pressed=true] .o-name{color:var(--signal);font-weight:600;}
  .o-name{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .o-n{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px;
       color:var(--mute);font-variant-numeric:tabular-nums;}
  .note{font-size:11.5px;line-height:1.7;color:var(--mute);margin:14px 0 0;}

  .feed{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:16px 18px;}
  .card-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:600;border:1px solid;border-radius:2px;
       padding:2px 7px;letter-spacing:.04em;}
  .src{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px;color:var(--mute);}
  .lang{font-size:10.5px;color:var(--mute);border:1px solid var(--line);
        border-radius:2px;padding:2px 6px;}
  .card-body{display:flex;gap:14px;align-items:flex-start;}
  .card-main{flex:1;min-width:0;}
  .thumb{flex:none;width:104px;height:78px;border-radius:2px;overflow:hidden;
         background:#DFE4EB;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .stats{display:flex;gap:12px;flex-wrap:wrap;align-items:center;
         font-family:ui-monospace,SFMono-Regular,monospace;
         font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;}
  .stats b{font-weight:600;color:#3A4453;}
  .heat{display:inline-flex;align-items:center;gap:5px;margin-left:auto;}
  .heat-bar{display:flex;gap:2px;}
  .heat-bar i{width:3px;height:12px;background:var(--line);display:block;}
  .heat-bar i.lit{background:#D1493F;}
  .heat-n{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;
          color:var(--mute);font-variant-numeric:tabular-nums;}
  .card h2{font-size:17px;font-weight:600;line-height:1.5;margin:0;letter-spacing:-.01em;}
  .card h2 a{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);
             background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;
             transition:background-size .2s;}
  .card h2 a:hover{background-size:100% 1px;}
  .sum{font-size:13.5px;line-height:1.75;color:#3A4453;margin:8px 0 0;}
  .orig{font-size:12px;line-height:1.6;color:var(--mute);margin:8px 0 0;}
  .orig summary{cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
  .card-btm{display:flex;align-items:center;justify-content:space-between;
            gap:10px;margin-top:12px;flex-wrap:wrap;}
  .models{display:flex;gap:5px;flex-wrap:wrap;}
  .m{font-size:11px;background:#EEF1F6;color:#4A5464;padding:2px 7px;border-radius:2px;}
  .go{font-size:12px;font-weight:600;color:var(--signal);text-decoration:none;white-space:nowrap;}
  .go:hover{text-decoration:underline;}
  .empty{background:var(--panel);border:1px dashed var(--line);padding:40px 20px;text-align:center;}
  .empty p{margin:0;font-size:15px;font-weight:600;}
  .empty .sub{margin-top:6px;font-size:13px;font-weight:400;color:var(--mute);}

  nav.tabs{background:var(--ink);border-top:1px solid rgba(255,255,255,.10);}
  .tabs-in{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;overflow-x:auto;}
  .tab{background:none;border:0;border-bottom:2px solid transparent;color:#8D97A8;
       font:inherit;font-size:13px;font-weight:600;padding:12px 16px;cursor:pointer;
       letter-spacing:.02em;white-space:nowrap;}
  .tab:hover{color:#fff;}
  .tab[aria-selected=true]{color:#fff;border-bottom-color:#6C7CFF;}

  /* 價格規格分頁 */
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:2px;
         padding:16px 18px;}
  .pcard.on{border-color:var(--signal);box-shadow:inset 3px 0 0 var(--signal);}
  .pcard h2{font-size:17px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em;}
  .pmeta{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px;
         color:var(--mute);margin-bottom:10px;}
  .mrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .mchip{font-size:11px;border:1px solid;border-radius:2px;padding:2px 7px;
         display:inline-flex;gap:5px;align-items:center;}
  .mchip b{font-weight:600;}
  .price{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px;
         color:var(--ink);}
  .trend{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;}
  .trend.up{color:#B23A2E;}
  .trend.down{color:#0F6E5C;}
  .plist{list-style:none;padding:0;margin:0 0 4px;}
  .plist li{font-size:12.5px;line-height:1.8;color:#3A4453;}
  .plist a{color:var(--signal);text-decoration:none;}
  .plist a:hover{text-decoration:underline;}
  .specgrid{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;
            font-size:12.5px;line-height:1.7;margin-top:6px;}
  .specgrid dt{color:var(--mute);white-space:nowrap;}
  .specgrid dd{margin:0;color:#3A4453;}
  .cmpbar{position:sticky;bottom:0;background:var(--ink);color:#fff;
          display:flex;align-items:center;gap:12px;padding:12px 18px;
          border-radius:2px;margin-top:12px;flex-wrap:wrap;}
  .cmpbar .n{font-size:13px;font-weight:600;}
  .cmptable{overflow-x:auto;background:var(--panel);border:1px solid var(--line);
            margin-top:12px;}
  .cmptable table{border-collapse:collapse;width:100%;font-size:12.5px;}
  .cmptable th,.cmptable td{border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);padding:8px 12px;text-align:left;
    vertical-align:top;}
  .cmptable th:first-child{color:var(--mute);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;white-space:nowrap;background:#F4F6F9;}
  .cmptable thead th{font-weight:600;font-size:13px;background:#F4F6F9;}
  .cmptable tr.diff td{background:#FFF8E8;}

  /* 儀表板 */
  .viewtabs{display:flex;gap:6px;margin-bottom:14px;}
  .viewtabs button{background:none;border:1px solid var(--line);border-radius:2px;
    padding:6px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    color:var(--mute);}
  .viewtabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:10px;margin-bottom:16px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:13px 15px;}
  .kpi .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
          font-weight:600;}
  .kpi .v{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px;
          font-variant-numeric:tabular-nums;margin-top:5px;letter-spacing:-.01em;}
  .kpi .s{font-size:11.5px;color:var(--mute);margin-top:2px;}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:2px;
            padding:15px 17px;margin-bottom:14px;}
  .panelbox h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;
               color:var(--mute);margin:0 0 12px;font-weight:600;}
  .panelbox .hint{font-size:11.5px;color:var(--mute);line-height:1.6;margin:10px 0 0;}
  .amap{overflow-x:auto;}
  .amap table{border-collapse:collapse;font-size:12px;width:100%;}
  .amap th,.amap td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;}
  .amap th:first-child,.amap td:first-child{text-align:left;white-space:nowrap;
    font-size:12.5px;}
  .amap thead th{font-family:ui-monospace,SFMono-Regular,monospace;color:var(--mute);
    font-weight:600;}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:11.5px;
          color:var(--mute);align-items:center;}
  .legend span{display:inline-flex;gap:5px;align-items:center;}
  .spark{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
  .sparkcell{border:1px solid var(--line);padding:10px 12px;}
  .sparkcell .t{font-size:12px;font-weight:600;margin-bottom:2px;}
  .sparkcell .m{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;
                color:var(--mute);margin-bottom:6px;}
  .bars{display:flex;flex-direction:column;gap:7px;}
  .barrow{display:grid;grid-template-columns:1fr 90px auto;gap:10px;align-items:center;
          font-size:12.5px;}
  .bartrack{background:#EEF1F6;height:9px;position:relative;}
  .barfill{background:var(--signal);height:100%;}
  .barn{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px;
        color:var(--mute);text-align:right;}
  .stars{color:#C98A00;letter-spacing:1px;}

  .ftoggle{display:none;}
  @media (max-width:760px){
    .thumb{width:76px;height:58px;}
    .grid{grid-template-columns:1fr;gap:16px;}
    .rail{position:static;max-height:none;overflow:visible;}
    .ftoggle{display:block;width:100%;margin-bottom:10px;}
    .rail.collapsed .fpanel{display:none;}
    h1{font-size:24px;}
    .clock-v{font-size:18px;}
    .bar-r{align-items:flex-start;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div>
      <div class="eyebrow" id="tEyebrow"></div>
      <h1 id="tTitle"></h1>
    </div>
    <div class="bar-r">
      <select id="uiLang" aria-label="Display language"></select>
      <div style="text-align:right">
        <span class="clock-l" id="tNext"></span>
        <span class="clock-v" id="clock">--:--:--</span>
      </div>
    </div>
  </div>
</header>

<nav class="tabs"><div class="tabs-in" id="tabs" role="tablist"></div></nav>

<div class="strip">
  <div class="strip-in">
    <span class="meta" id="status"></span>
    <div class="strip-r">
      <div class="sortwrap">
        <label for="sort" id="tSort"></label>
        <select id="sort"></select>
      </div>
      <button class="btn ghost" id="rescrape" hidden></button>
      <button class="btn" id="reload"></button>
    </div>
  </div>
</div>

<div class="wrap"><div id="msg"></div></div>

<main class="wrap grid">
  <aside class="rail collapsed" id="rail">
    <button class="btn ghost ftoggle" id="ftoggle"></button>
    <div class="fpanel">
      <div class="fhead">
        <span class="eyebrow" style="color:var(--ink)" id="tFilter"></span>
        <button class="clearall" id="clearAll" hidden></button>
      </div>
      <div id="groups"></div>
      <p class="note" id="tNote"></p>
      <p class="note" id="ver" style="opacity:.7"></p>
    </div>
  </aside>
  <section class="feed" id="feed"></section>
</main>

<script>
/* ================================================================== */
/*  介面語言字典                                                       */
/*  要加語言:在這裡多加一組,並在爬蟲的 TARGET_LANGS 加上同一個代碼。  */
/* ================================================================== */

const UI = {
  "zh-TW": {
    name: "繁體中文", htmlLang: "zh-Hant",
    tabs: { models: "AI 語言模型", spark: "DGX Spark 機種" },
    eyebrow: "每日 06:00 · AI 語言模型", title: "模型快訊監測台",
    next: "距下次自動更新", sort: "排序", reload: "立即更新",
    filter: "篩選", clearAll: "清除全部", filterBtn: "篩選條件", filterHide: "收起篩選",
    sorts: { heat: "熱門程度",
             new: "時間 · 最新在前", old: "時間 · 最舊在前",
             source: "來源名稱", tag: "主題分類", title: "標題" },
    groups: { date: "日期", line: "產品線",
              camp: "模型", brand: "品牌",
              lang: "原文語言",
              tag: "主題", source: "資訊來源" },
    picked: (n) => `已選 ${n}`,
    status: (a, b, f, e) => `${a} / ${b} 則` +
      (f ? ` · ${f} 個篩選條件` : "") + ` · 已載入 ${e} 期`,
    tags: { "產品發表": "產品發表", "研究": "研究", "商業": "商業",
            "政策": "政策", "安全": "安全",
            "開箱評測": "開箱評測", "規格效能": "規格效能", "價格上市": "價格上市", "應用案例": "應用案例",
            "社群討論": "社群討論",
            "官方發布": "官方發布",
            "影片": "影片" },
    langs: { zh: "中文", en: "英文", ja: "日文", ko: "韓文" },
    camps: { openai: "OpenAI · GPT", anthropic: "Anthropic · Claude",
             google: "Google · Gemini", meta: "Meta · Llama",
             cn: "中國模型", other: "其他業者",
             nvidia: "NVIDIA 原廠" },
    open: "開啟原文 ↗", showOriginal: "顯示原文", untranslated: "原文",
    emptyTitle: "沒有符合這些條件的新聞。",
    emptyHint: "試著取消幾個條件,或按「清除全部」。",
    emptyNoData: "資料可能還沒擷取。",
    note: "每一組都可以複選,同一組內是「或」,不同組之間是「且」。括號裡的數字會隨其他條件即時變動。",
    loading: (d) => `正在載入 ${d} 期…`,
    errLoad: (m) => `讀不到 data/news.json（${m}）。若這是第一次部署,先到 Actions 頁面手動跑一次擷取。`,
    errArchive: (d, m) => `讀不到 ${d} 期的存檔（${m}）。`,
    errRefresh: (m) => `更新失敗:${m}`,
    reloading: "讀取中…",
    shop: { tab: "價格規格", region: "區域", country: "國家", platform: "通路", status: "狀態", spec: "規格", memory: "記憶體", storage: "儲存", form: "型式", compare: "比較", clear: "清除", specs: "規格表", markets: "各國貨況", signals: "貨況消息", noPrice: "無報價", pickTwo: "勾選兩個以上的機種才能比較", selected: "已選", st: { unannounced: "未發表", announced: "已發表", preorder: "預購", launched: "開賣", oos: "缺貨" }, rg: { apac: "亞太", na: "北美", emea: "歐洲" } },
    dash: { dash: "儀表板", list: "清單", tracked: "追蹤機種", onsale: "已開賣市場", cheapest: "最低價", newReviews: "7 日新增評論", launchMap: "開賣區域", priceTrend: "價格趨勢", salesProxy: "銷售動能（推估）", salesNote: "電商不公開銷量，這裡以評論數的增量推估，僅供參考", reviews: "評價", noHistory: "累積幾天資料後才會出現趨勢線", days: "天" },
    rescrape: '重新爬取',
    rescrapeAsk: '貼上具 actions:write 權限的 GitHub token（只存在本次瀏覽階段，不會寫進網頁）：',
    rescrapeSent: '已送出爬取要求。約 5–8 分鐘後按「立即更新」取回新資料。',

const isTranslated = (it) =>

/* --- 備援：瀏覽器內建翻譯（Chrome 138+）。沒有 API 金鑰時仍能看到譯文。 --- */
// 兩個後端吃的語言代碼不一樣，分開對照
const MT_LANG = { "zh-TW": "zh-Hant", "zh-CN": "zh-Hans" };   // Chrome 內建翻譯
const MM_LANG = { "zh-TW": "zh-TW", "zh-CN": "zh-CN" };       // MyMemory
const mtCache = new Map();    // `${url}|${lang}` → { title, summary }
const mtPool = new Map();
let mtOff = false;

async function mtGet(src, tgt) {
  const key = `${src}|${tgt}`;
  if (mtPool.has(key)) return mtPool.get(key);
  const a = await Translator.availability({ sourceLanguage: src, targetLanguage: tgt });
  const tr = a === "unavailable"
    ? null
    : await Translator.create({ sourceLanguage: src, targetLanguage: tgt });
  mtPool.set(key, tr);
  return tr;
}

/* 第二層備援：MyMemory 免費翻譯 API，不需要金鑰。
   匿名額度約每日 5 千字；填入 email 可提高到 5 萬字。
   品質與額度都不如爬蟲端預先翻譯，只是沒有金鑰時的替代方案。 */
const MM_EMAIL = "";          // 想提高額度就填自己的 email
let mmOff = false;

async function mmTranslate(text, src, tgt) {
  const u = new URL("https://api.mymemory.translated.net/get");
  u.searchParams.set("q", text.slice(0, 480));
  u.searchParams.set("langpair", `${src}|${tgt}`);
  if (MM_EMAIL) u.searchParams.set("de", MM_EMAIL);
  const r = await fetch(u);
  const j = await r.json();
  const out = j && j.responseData && j.responseData.translatedText;
  if (!out || Number(j.responseStatus) !== 200) throw new Error("quota");
  return out;
}

/* 譯文寫進 localStorage，換頁或重新載入不必重譯，省額度。 */
function mtLoad() {
  try {
    const raw = localStorage.getItem("mtCache");
    if (raw) for (const [k, v] of Object.entries(JSON.parse(raw))) mtCache.set(k, v);
  } catch {}
}
function mtSave() {
  try {
    const obj = {};
    let n = 0;
    for (const [k, v] of mtCache) { if (n++ > 600) break; obj[k] = v; }
    localStorage.setItem("mtCache", JSON.stringify(obj));
  } catch {}
}

async function machineTranslate(list) {
  const tgt = MT_LANG[cur] || cur;
  const todo = list.filter((i) => !isTranslated(i)
                                  && langOf(i) !== cur.split("-")[0]).slice(0, 15);
  if (!todo.length) return;

  const builtin = !mtOff && typeof Translator !== "undefined";
  if (!builtin && mmOff) return;

  let n = 0;
  for (const it of todo) {
    const src = langOf(it);
    try {
      let title, summary;
      if (builtin) {
        const tr = await mtGet(src, tgt);
        if (!tr) continue;
        title = await tr.translate(it.title);
        summary = it.summary ? await tr.translate(it.summary) : "";
      } else {
        const mtgt = MM_LANG[cur] || cur;
        title = await mmTranslate(it.title, src, mtgt);
        summary = it.summary ? await mmTranslate(it.summary, src, mtgt) : "";
      }
      mtCache.set(`${it.url}|${cur}`, { title, summary });
      n++;
    } catch {
      if (builtin) { mtOff = true; } else { mmOff = true; }
      break;        // 額度用盡或不支援就停手，已翻好的仍會顯示
    }
  }
  if (n) { mtSave(); renderFeed(); }
}

function langOf(it) {
  if (it.lang) return it.lang;
  const t = String(it.title || "");
  if (/[\u3040-\u30ff]/.test(t)) return "ja";
  if (/[\uac00-\ud7af]/.test(t)) return "ko";
  const cjk = (t.match(/[\u4e00-\u9fff]/g) || []).length;
  return cjk / (t.replace(/\s/g, "").length || 1) > 0.15 ? "zh" : "en";
}

const timeOf = (it) => {
  const ms = Date.parse(String(it.publishedAt || it.date || "").replace(" ", "T"));
  return Number.isNaN(ms) ? 0 : ms;
};

function tick() {
  const now = new Date(), t = new Date();
  t.setHours(6, 0, 0, 0);
  if (now >= t) t.setDate(t.getDate() + 1);
  const s = Math.max(0, Math.floor((t - now) / 1000));
  const p = (n) => String(n).padStart(2, "0");
  $("clock").textContent = `${p(s / 3600 | 0)}:${p(s % 3600 / 60 | 0)}:${p(s % 60)}`;
}
setInterval(tick, 1000); tick();

async function grab(path) {
  const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadEdition(edition) {
  if (loaded.has(edition)) return;
  const p = await grab(`${CH().base}/archive/${edition}.json`);
  loaded.set(edition, (p.items || []).map((it) => ({ ...it, edition })));
  merge();
}

function merge() {
  const seen = new Set(); items = [];
  for (const list of loaded.values()) {
    for (const it of list) {
      const key = String(it.url || "").split("?")[0];
      if (key && !seen.has(key)) { seen.add(key); items.push(it); }
    }
  }
}

async function bootShop() {
  booted = true;
  try {
    const payload = await grab(`${CH().base}/products.json`);
    dataVer = payload.version || "舊版（無版本標記）";
    dataTime = payload.fetchedAt || "";
    products = payload.products || [];
    say("");
    renderAll();
  } catch (err) {
    products = [];
    renderAll();
    say(esc(T().errLoad(err.message)), "bad");
  }
}

async function boot() {
  if (CH().kind === "shop") return bootShop();
  booted = true;
  const base = CH().base;
  try {
    const latest = await grab(`${base}/news.json`);
    dataVer = latest.version || "舊版（無版本標記）";
    dataTime = latest.fetchedAt || "";
    const c = latest.edition;
    loaded.set(c, (latest.items || []).map((it) => ({ ...it, edition: c })));
    F.date.add(c);
    try {
      const idx = await grab(`${base}/index.json`);
      editions = (idx.editions || []).slice(0, 30);
      editionCounts = idx.counts || {};
    } catch { editions = []; editionCounts = {}; }
    if (!editions.includes(c)) editions.unshift(c);
    merge(); say(""); renderAll();
  } catch (err) {
    items = []; renderAll();
    say(esc(T().errLoad(err.message)), "bad");
  }
}

async function switchTab(next) {
  if (next === ch || !CHANNELS[next]) return;
  saveState();
  ch = next;
  restoreState();
  renderAll();
  if (!booted) await boot();
}

// 價格規格分頁的比對：任一市場符合就算符合
const SHOP_TESTS = {
  region:   (p, s) => p.markets.some((m) => s.has(m.region)),
  country:  (p, s) => p.markets.some((m) => s.has(m.country)),
  status:   (p, s) => p.markets.some((m) => s.has(m.status)),
  platform: (p, s) => p.markets.some((m) => m.offers.some((o) => s.has(o.platform))),
  camp:     (p, s) => s.has(p.brand),
  line:     (p, s) => s.has(p.line),
  memory:   (p, s) => s.has(p.facets.memory),
  storage:  (p, s) => s.has(p.facets.storage),
  form:     (p, s) => s.has(p.facets.form),
};

function passShop(p, skip) {
  for (const k of Object.keys(SHOP_TESTS)) {
    if (k === skip) continue;
    if (F[k].size && !SHOP_TESTS[k](p, F[k])) return false;
  }
  return true;
}
const shopCount = (g, v) =>
  products.filter((p) => passShop(p, g) && SHOP_TESTS[g](p, new Set([v]))).length;

const TESTS = {
  date:   (it, s) => s.has(it.edition),
  line:   (it, s) => (it.lines || ["other"]).some((l) => s.has(l)),
  camp:   (it, s) => (it.camps || ["other"]).some((c) => s.has(c)),
  lang:   (it, s) => s.has(langOf(it)),
  tag:    (it, s) => s.has(it.tag),
  source: (it, s) => s.has(it.source),
};

function pass(it, skip) {
  const force = CH().forceLine;
  if (force && !(it.lines || []).includes(force)) return false;
  for (const k of Object.keys(F)) {
    if (k === skip) continue;
    if (F[k].size && !TESTS[k](it, F[k])) return false;
  }
  return true;
}
const countFor = (g, v) =>
  items.filter((it) => pass(it, g) && TESTS[g](it, new Set([v]))).length;

function results() {
  const cmp = {
    heat:   (a, b) => (b.heat || 0) - (a.heat || 0) || timeOf(b) - timeOf(a),
    new:    (a, b) => timeOf(b) - timeOf(a),
    old:    (a, b) => timeOf(a) - timeOf(b),
    source: (a, b) => String(a.source).localeCompare(String(b.source), cur) || timeOf(b) - timeOf(a),
    tag:    (a, b) => String(T().tags[a.tag] || a.tag)
                        .localeCompare(String(T().tags[b.tag] || b.tag), cur) || timeOf(b) - timeOf(a),
    title:  (a, b) => field(a, "title").localeCompare(field(b, "title"), cur),
  }[sortBy];
  return items.filter((it) => pass(it, null)).sort(cmp);
}
const activeCount = () => Object.values(F).reduce((n, s) => n + s.size, 0);

function renderDateGroup(t) {
  const months = new Map();
  for (const d of editions) {
    const ym = d.slice(0, 7);
    if (!months.has(ym)) months.set(ym, []);
    months.get(ym).push(d);

  if (!months.size) return "";

  const openMonths = new Set(
    [...document.querySelectorAll("details.mo[open]")].map((e) => e.dataset.mo));
  const first = !document.querySelector("details.mo");
  const newest = editions[0] ? editions[0].slice(0, 7) : "";

  return [...months.entries()].map(([ym, days]) => {
    const picked = days.filter((d) => F.date.has(d)).length;
    const total = days.reduce((n, d) => n + dateCount(d), 0);
    const open = first ? (ym === newest || picked > 0) : openMonths.has(ym);
    return `<details class="mo" data-mo="${ym}" ${open ? "open" : ""}>
      <summary>
        <span>${esc(monthLabel(ym))}</span>
        ${picked ? `<span class="mo-sel">${esc(t.picked(picked))}</span>` : ""}
        <span class="mo-n">${total}</span>
      </summary>
      <div class="mo-body">
        ${days.map((d) => {
          const on = F.date.has(d);
          const n = dateCount(d);

            <span class="box" aria-hidden="true">${on ? "✓" : ""}</span>
            <span class="o-name">${esc(d.slice(5))}</span>

        }).join("")}

  }).join("");
}

function money(o) {
  if (!o.price) return "";

  const digits = NO_DECIMAL.has(cc) ? 0 : (Number.isInteger(o.price) ? 0 : 2);
  try {

      style: "currency", currency: cc,
      minimumFractionDigits: digits, maximumFractionDigits: digits,

    return `${cc} ${o.price.toLocaleString(cur, { maximumFractionDigits: digits })}`;
  }
}

/* ---------- 迷你折線圖：純 SVG，不用任何函式庫 ---------- */
function sparkline(series, key, w = 190, h = 40) {
  const pts = series.filter((r) => typeof r[key] === "number");
  if (pts.length < 2) return "";
  const vals = pts.map((r) => r[key]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  const x = (i) => (i / (pts.length - 1)) * (w - 2) + 1;
  const y = (v) => h - 3 - ((v - lo) / span) * (h - 8);
  const line = pts.map((r, i) => `${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join(" ");
  const area = `1,${h - 1} ${line} ${(w - 1).toFixed(1)},${h - 1}`;
  const last = pts[pts.length - 1];
  const rising = last[key] > pts[0][key];
  const col = rising ? "#B23A2E" : "#0F6E5C";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"
       preserveAspectRatio="none" role="img">
    <polygon points="${area}" fill="${col}" opacity="0.08"></polygon>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.5"></polyline>
    <circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(last[key]).toFixed(1)}"
            r="2.5" fill="${col}"></circle>
  </svg>`;
}

function stars(v) {
  const full = Math.round(v);
  return `<span class="stars">${"★".repeat(full)}${"☆".repeat(5 - full)}</span>`;

function renderDash(shown, t) {

           - (b.m.best.price * (conv[b.m.best.currency] || 1));

  // 開賣區域矩陣
  const cc = ["TW", "JP", "US", "DE", "GB", "FR"];
  const mapRows = shown.map((p) => {

    p.markets.forEach((m) => { by[m.country] = m; });

  const amap = `<div class="panelbox"><h3>${esc(d.launchMap)}</h3>
    <div class="amap"><table>
      <thead><tr><th></th>${cc.map((c) => `<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${mapRows}</tbody></table></div>
    <div class="legend">${STATUS_ORDER.map((k) =>
      `<span><span class="dot" style="background:${STATUS_COLOR[k]}"></span>${esc(sh.st[k])}</span>`
    ).join("")}</div></div>`;

  // 價格趨勢
  const trendCells = flatMarkets
    .filter(({ m }) => (m.history || []).length >= 2)
    .slice(0, 12)
    .map(({ p, m }) => {
      const h = m.history;
      const first = h[0].p, last = h[h.length - 1].p;
      const delta = last - first;
      return `<div class="sparkcell">
        <div class="t">${esc(p.name)}</div>
        <div class="m">${m.country} · ${esc(money({ price: last, currency: h[h.length - 1].c }))}
          ${delta ? `<span class="trend ${delta > 0 ? "up" : "down"}">
            ${delta > 0 ? "▲" : "▼"}${Math.abs(delta).toLocaleString()}</span>` : ""}
          · ${h.length} ${esc(d.days)}</div>
        ${sparkline(h, "p")}</div>`;
    }).join("");

  const price = `<div class="panelbox"><h3>${esc(d.priceTrend)}</h3>
    ${trendCells ? `<div class="spark">${trendCells}</div>`
                 : `<p class="hint">${esc(d.noHistory)}</p>`}</div>`;

  // 銷售動能（評論增量）
  const momentum = flatMarkets
    .map(({ p, m }) => {
      const h = (m.reviewHistory || []).filter((r) => r.n != null);
      if (h.length < 2) return null;
      const cut = h.slice(-8);
      return { name: `${p.name} · ${m.country}`,
               delta: Math.max(0, cut[cut.length - 1].n - cut[0].n),
               total: cut[cut.length - 1].n };
    })
    .filter((x) => x && x.delta > 0)
    .sort((a, b) => b.delta - a.delta).slice(0, 10);
  const peak = Math.max(1, ...momentum.map((x) => x.delta));

  const sales = `<div class="panelbox"><h3>${esc(d.salesProxy)}</h3>
    ${momentum.length ? `<div class="bars">${momentum.map((x) =>
      `<div class="barrow"><span>${esc(x.name)}</span>
        <span class="bartrack"><span class="barfill"
          style="width:${(x.delta / peak * 100).toFixed(0)}%"></span></span>
        <span class="barn">+${x.delta} / ${x.total}</span></div>`).join("")}</div>`
      : `<p class="hint">${esc(d.noHistory)}</p>`}
    <p class="hint">${esc(d.salesNote)}</p></div>`;

  // 評分
  const rated = flatMarkets.filter(({ m }) => m.rating)
    .sort((a, b) => b.m.rating - a.m.rating).slice(0, 10);
  const reviews = rated.length ? `<div class="panelbox"><h3>${esc(d.reviews)}</h3>
    <div class="bars">${rated.map(({ p, m }) =>
      `<div class="barrow" style="grid-template-columns:1fr auto auto">
        <span>${esc(p.name)} · ${m.country}</span>
        <span>${stars(m.rating)}</span>
        <span class="barn">${m.rating}${m.reviews ? ` (${m.reviews})` : ""}</span>
      </div>`).join("")}</div></div>` : "";

  return kpis + amap + price + sales + reviews;
}

function renderShop() {
  const t = T(), sh = t.shop;
  const shown = products.filter((p) => passShop(p, null));
  $("status").textContent =
    `${shown.length} / ${products.length}` +
    (activeCount() ? ` · ${activeCount()} ${t.filter}` : "") +
    (picked.size ? ` · ${sh.compare} ${picked.size}` : "");

  const tabs = `<div class="viewtabs">
    <button data-view="dash" aria-selected="${shopView === "dash"}">${esc(t.dash.dash)}</button>
    <button data-view="list" aria-selected="${shopView === "list"}">${esc(t.dash.list)}</button>
  </div>`;

  const bindTabs = () => {
    $("feed").querySelectorAll("[data-view]").forEach((b) => {
      b.onclick = () => { shopView = b.dataset.view; renderShop(); };
    });
  };

  if (!shown.length) {
    $("feed").innerHTML = tabs + `<div class="empty">
      <p>${esc(t.emptyTitle)}</p>
      <p class="sub">${esc(activeCount() ? t.emptyHint : t.emptyNoData)}</p></div>`;
    bindTabs();
    return;
  }

  if (shopView === "dash") {
    $("feed").innerHTML = tabs + renderDash(shown, t);
    bindTabs();
    return;
  }

  const cards = shown.map((p) => {
    const on = picked.has(p.id);
    const chips = p.markets.map((m) => {
      const c = STATUS_COLOR[m.status] || "#6A7484";
      const best = m.best || m.offers.filter((o) => o.price)
        .sort((a, b) => a.price - b.price)[0];
      const tr = m.trend;
      const arrow = tr
        ? `<span class="trend ${tr.delta > 0 ? "up" : "down"}">
             ${tr.delta > 0 ? "▲" : "▼"}${Math.abs(tr.delta).toLocaleString()}</span>`
        : "";
      return `<span class="mchip" style="color:${c};border-color:${c}"
              ${tr ? `title="${esc(tr.since)} ${tr.prev.toLocaleString()}"` : ""}>
        <b>${m.country}</b>${esc(sh.st[m.status] || m.status)}
        ${best ? `<span class="price">${esc(money(best))}</span>` : ""}${arrow}
      </span>`;
    }).join("");

    const offers = p.markets
      .flatMap((m) => m.offers.map((o) => ({ ...o, c: m.country })))
      .sort((a, b) => (a.c === b.c ? (a.price || 0) - (b.price || 0)
                                  : a.c.localeCompare(b.c)));
    const cheapest = {};
    for (const o of offers) {
      if (o.price && (!cheapest[o.c] || o.price < cheapest[o.c])) cheapest[o.c] = o.price;
    }
    const offerList = offers.length ? `<ul class="plist">${offers.map((o) =>
      `<li>${o.c} · ${esc(o.platform)} ·
        <b>${esc(money(o) || sh.noPrice)}</b>
        ${o.price && o.price === cheapest[o.c] ? " ★" : ""}
        ${o.url ? `<a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">↗</a>` : ""}
        <br><span class="src">${esc(o.title || "")}</span>
      </li>`).join("")}</ul>` : "";

    const sigs = (p.signals || []).length ? `<details class="orig">
      <summary>${esc(sh.signals)} (${p.signals.length})</summary>
      <ul class="plist" style="margin-top:6px">${p.signals.map((g) =>
        `<li><span style="color:${STATUS_COLOR[g.status]}">${esc(sh.st[g.status])}</span>
          ${g.countries.length ? " · " + g.countries.join("/") : ""} ·
          <a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">${esc(g.title)}</a>
          <span class="src">${esc(g.date)}</span></li>`).join("")}</ul>
    </details>` : "";

    return `<article class="pcard${on ? " on" : ""}">
      <div class="card-top">
        <span class="tag" style="color:${TAG_COLORS["產品發表"]};border-color:${TAG_COLORS["產品發表"]}">
          ${esc(LINE_FIXED[p.line] || p.line)}</span>
        <span class="src">${esc(BRAND_FIXED[p.brand] || t.camps[p.brand] || p.brand)}</span>
        <button class="opt" style="width:auto;margin-left:auto" aria-pressed="${on}"
                data-cmp="${esc(p.id)}">
          <span class="box" aria-hidden="true">${on ? "✓" : ""}</span>
          <span class="o-name">${esc(sh.compare)}</span></button>
      </div>
      <h2>${esc(p.name)}</h2>
      <div class="pmeta">${esc(p.specs.chip)} · ${esc(p.facets.memory)} · ${esc(p.facets.storage)}</div>
      <div class="mrow">${chips}</div>
      ${p.markets.filter((m) => m.rating).map((m) =>
        `<div class="stats" style="margin-bottom:8px">
           <span>${m.country} ${stars(m.rating)} <b>${m.rating}</b>
           ${m.reviews ? `(${m.reviews})` : ""}
           ${m.reviewDelta > 0 ? `<span class="trend up">+${m.reviewDelta}</span>` : ""}</span>
         </div>`).join("")}
      ${offerList}
      ${sigs}
      <details class="orig"><summary>${esc(sh.specs)}</summary>
        <dl class="specgrid">${SPEC_ROWS.filter((k) => p.specs[k]).map((k) =>
          `<dt>${esc(specLabel(k, t))}</dt><dd>${esc(p.specs[k])}</dd>`).join("")}</dl>
      </details>
    </article>`;
  }).join("");

  const bar = picked.size ? `<div class="cmpbar">
      <span class="n">${esc(sh.compare)} · ${picked.size} ${esc(sh.selected)}</span>
      <button class="btn ghost" id="cmpClear" style="color:#fff;border-color:#ffffff55">
        ${esc(sh.clear)}</button>
    </div>${picked.size >= 2 ? compareTable(shown, t) : `<div class="msg">${esc(sh.pickTwo)}</div>`}`
    : "";

  $("feed").innerHTML = tabs + cards + bar;
  bindTabs();

  $("feed").querySelectorAll("[data-cmp]").forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.cmp;
      picked.has(id) ? picked.delete(id) : picked.add(id);
      renderShop();
    };
  });
  const clr = $("feed").querySelector("#cmpClear");
  if (clr) clr.onclick = () => { picked.clear(); renderShop(); };
}

/** 規格比較表：有差異的列會標色 */
function compareTable(shown, t) {
  const sel = products.filter((p) => picked.has(p.id));
  const rows = SPEC_ROWS.filter((k) => sel.some((p) => p.specs[k]));
  const head = `<tr><th></th>${sel.map((p) =>
    `<th>${esc(p.name)}</th>`).join("")}</tr>`;

  const body = rows.map((k) => {
    const vals = sel.map((p) => p.specs[k] || "—");
    const diff = new Set(vals).size > 1;
    return `<tr class="${diff ? "diff" : ""}">
      <th>${esc(specLabel(k, t))}</th>
      ${vals.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`;
  }).join("");

  const priceRow = `<tr><th>${esc(t.shop.markets)}</th>${sel.map((p) =>
    `<td>${p.markets.filter((m) => m.status !== "unannounced").map((m) =>
      `${m.country}:${esc(t.shop.st[m.status])}`).join("<br>") || "—"}</td>`).join("")}</tr>`;

  return `<div class="cmptable"><table>
    <thead>${head}</thead><tbody>${body}${priceRow}</tbody></table></div>`;
}

function renderFeed() {
  const t = T(), shown = results(), n = activeCount();
  $("status").textContent = t.status(shown.length, items.length, n, loaded.size);

  if (!shown.length) {
    $("feed").innerHTML = `<div class="empty">
      <p>${esc(t.emptyTitle)}</p>
      <p class="sub">${esc(n ? t.emptyHint : t.emptyNoData)}</p></div>`;
    return;
  }

  machineTranslate(shown);

  $("feed").innerHTML = shown.map((i) => {
    const color = TAG_COLORS[i.tag] || "#6A7484";
    const when = String(i.date || "").slice(0, 16).replace("T", " ");
    const srcLang = t.langs[langOf(i)] || langOf(i);
    const done = isTranslated(i);
    const title = field(i, "title"), summary = field(i, "summary");
    return `<article class="card">
      <div class="card-top">
        <span class="tag" style="color:${color};border-color:${color}">${esc(t.tags[i.tag] || i.tag || "")}</span>
        <span class="src">${esc(i.source)} · ${esc(when)}</span>
        <span class="lang">${esc(srcLang)}${done ? "" : " · " + esc(t.untranslated)}</span>
        ${heatBadge(i, t)}
      </div>
      <div class="card-body">
        <div class="card-main">
          <h2><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a></h2>
          ${summary ? `<p class="sum">${esc(summary)}</p>` : ""}
        </div>
        ${i.image ? `<div class="thumb"><img src="${esc(i.image)}" alt="" loading="lazy"
             referrerpolicy="no-referrer"
             onerror="this.parentNode.remove()"></div>` : ""}
      </div>
      ${done && i.title !== title ? `<details class="orig">
        <summary>${esc(t.showOriginal)}</summary>
        <div style="margin-top:6px">${esc(i.title)}${i.summary ? "<br>" + esc(i.summary) : ""}</div>
      </details>` : ""}
      ${statsRow(i)}
      <div class="card-btm">
        <div class="models">${(i.models || []).map((m) => `<span class="m">${esc(m)}</span>`).join("")}</div>
        <a class="go" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(t.open)}</a>
      </div>
    </article>`;
  }).join("");
}

function renderAll() {
  renderChrome();
  if (CH().kind === "shop") { renderShopGroups(); renderShop(); }
  else { renderGroups(); renderFeed(); }
}

/* ================================================================== */
/*  事件                                                              */
/* ================================================================== */

$("uiLang").onchange = () => { cur = $("uiLang").value; savePref(cur); renderAll(); };
$("sort").onchange = () => { sortBy = $("sort").value; renderFeed(); };
$("clearAll").onclick = () => { Object.values(F).forEach((s) => s.clear()); renderAll(); };
if (GITHUB_REPO) {
  $("rescrape").hidden = false;
  $("rescrape").onclick = async () => {
    const t = T();
    let token = "";
    try { token = sessionStorage.getItem("ghToken") || ""; } catch {}
    if (!token) {
      token = (prompt(t.rescrapeAsk) || "").trim();
      if (!token) return;
      try { sessionStorage.setItem("ghToken", token); } catch {}
    }
    $("rescrape").disabled = true;
    try {
      const res = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/${GITHUB_WORKFLOW}/dispatches`,
        {
          method: "POST",
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          },
          body: JSON.stringify({ ref: "main" }),
        });
      if (res.status === 204) {
        say(esc(t.rescrapeSent), "good");
      } else {
        try { sessionStorage.removeItem("ghToken"); } catch {}
        const body = await res.text();
        say(esc(t.rescrapeFail(`${res.status} ${body.slice(0, 120)}`)), "bad");
      }
    } catch (err) {
      say(esc(t.rescrapeFail(err.message)), "bad");
    } finally {
      $("rescrape").disabled = false;
    }
  };
}

$("ftoggle").onclick = () => {
  $("rail").classList.toggle("collapsed");
  $("ftoggle").textContent = $("rail").classList.contains("collapsed")
    ? T().filterBtn : T().filterHide;
};
$("reload").onclick = async () => {
  const t = T();
  const before = dataTime;
  if (CH().kind === "shop") {
    $("reload").disabled = true; $("reload").textContent = t.reloading;
    try {
      const payload = await grab(`${CH().base}/products.json`);
      dataVer = payload.version || dataVer;
      dataTime = payload.fetchedAt || "";
      products = payload.products || [];
      renderAll();
      const stamp = dataTime.slice(0, 16).replace("T", " ");
      say(esc(dataTime === before ? t.reloadSame(stamp) : t.reloadFresh(stamp)),
          dataTime === before ? "" : "good");
    } catch (err) {
      say(esc(t.errRefresh(err.message)), "bad");
    } finally {
      $("reload").disabled = false; $("reload").textContent = t.reload;
    }
    return;
  }
  $("reload").disabled = true; $("reload").textContent = t.reloading;
  const keep = new Set(F.date);
  loaded.clear(); F.date.clear();
  try {
    const latest = await grab(`${CH().base}/news.json`);
    dataVer = latest.version || "舊版（無版本標記）";
    dataTime = latest.fetchedAt || "";
    const c = latest.edition;
    loaded.set(c, (latest.items || []).map((it) => ({ ...it, edition: c })));
    for (const d of keep) {
      if (d === c) continue;
      try { await loadEdition(d); F.date.add(d); } catch {}
    }
    F.date.add(c);
    if (!editions.includes(c)) editions.unshift(c);
    try {
      const idx = await grab(`${CH().base}/index.json`);
      editions = (idx.editions || editions).slice(0, 30);
      editionCounts = idx.counts || editionCounts;
    } catch { /* 索引讀不到就沿用舊的 */ }
    merge(); renderAll();
    const stamp = dataTime.slice(0, 16).replace("T", " ");
    say(esc(dataTime && dataTime === before
      ? t.reloadSame(stamp) : t.reloadFresh(stamp)),
      dataTime === before ? "" : "good");
  } catch (err) {
    say(esc(t.errRefresh(err.message)), "bad");
  } finally {
    $("reload").disabled = false; $("reload").textContent = T().reload;
  }
};

mtLoad();
cur = loadPref();
if (window.innerWidth > 760) $("rail").classList.remove("collapsed");
renderChrome();
boot();
</script>
