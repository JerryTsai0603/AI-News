name: 每日 AI 新聞擷取

on:
  schedule:
    - cron: "0 22 * * *"      # UTC 22:00 = 台北時間隔日 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 擷取與翻譯（兩個分頁）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 九種語言。想省費用就刪掉不需要的，網頁會自動改顯示原文。
          TARGET_LANGS: "zh-TW,zh-CN,en,ja,ko,de,es,fr,it"
        run: python scraper.py all

      - name: 提交結果
        run: |
          git config user.name  "ai-news-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "沒有新資料"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
