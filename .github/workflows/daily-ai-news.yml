name: 每日 AI 新聞擷取

on:
  schedule:
    - cron: "0 22 * * *"      # UTC 22:00 = 台北時間隔日 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45        # 超時就中斷，不再讓它跑一小時以上
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 擷取與翻譯
        env:
          # ---- 翻譯金鑰：設其中一組就會生效 ----
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
          LLM_PROVIDER:      ${{ vars.LLM_PROVIDER }}
          LLM_MODEL:         ${{ vars.LLM_MODEL }}
          LLM_BASE_URL:      ${{ vars.LLM_BASE_URL }}

          # 翻譯的時間上限（分鐘／每個分頁）與並行數，可在 Variables 調整
          TRANSLATE_BUDGET_MIN: ${{ vars.TRANSLATE_BUDGET_MIN }}
          LLM_WORKERS:          ${{ vars.LLM_WORKERS }}

          # ---- Reddit：雲端 IP 常被擋 403，建議設 ----
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

          # ---- YouTube：不設也有頻道 feed，設了才能關鍵字搜尋 ----
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          YT_CHANNELS:       ${{ vars.YT_CHANNELS }}

          # ---- X：搜尋需付費方案，沒有就自動跳過 ----
          X_BEARER_TOKEN:    ${{ secrets.X_BEARER_TOKEN }}

          TARGET_LANGS: "zh-TW,zh-CN,en,ja,ko,de,es,fr,it"
        run: python scraper.py all

      - name: 提交結果
        if: always()           # 即使前一步中途失敗，也把已抓到的資料存下來
        run: |
          git config user.name  "ai-news-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "沒有新資料"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
